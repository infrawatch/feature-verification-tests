---
- name: Verify Perses CRDs are present
  ansible.builtin.include_tasks:
    file: verify_perses_crds.yml
  tags: precheck

- name: Verify Perses datasource is created
  ansible.builtin.include_tasks:
    file: verify_datasource.yml
  tags: test

- name: Verify Perses dashboards are created and owned by MetricStorage
  ansible.builtin.include_tasks:
    file: verify_dashboards.yml
  tags: test

- name: Verify legacy Grafana ConfigMaps are cleaned up
  ansible.builtin.include_tasks:
    file: verify_legacy_cleanup.yml
  tags: test

- name: Verify disabled dashboards are absent
  ansible.builtin.include_tasks:
    file: verify_disabled_dashboards.yml
  when: telemetry_perses_disabled_dashboards | length > 0
  tags: test
