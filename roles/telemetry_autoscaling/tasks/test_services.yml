---
# Verify Orchestration (heat) and telemetry services resources are ready for autoscaling
#
# Each CR check is a cheap "oc get" that gathers the status, followed by a
# TEST-prefixed assert that reports it. Gathering with failed_when: false means
# one unready CR no longer aborts the file, so all four are always reported.

- name: Verify that custom resource HEAT is ready
  ansible.builtin.command:
    cmd: |
      oc get heat heat -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}{"\n"}'
  register: heat_cr
  failed_when: false

- name: |
    TEST Verify the heat custom resource is ready
  ansible.builtin.assert:
    that:
      - heat_cr.stdout | default('') | trim == "True"
    success_msg: "the heat CR reports Ready=True"
    fail_msg: >-
      the heat CR reports Ready={{ heat_cr.stdout | default('') | trim | default('<empty>', true) }},
      expected True

- name: Verify that custom resource CEILOMETER is ready
  ansible.builtin.command:
    cmd: |
      oc get ceilometer ceilometer -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}{"\n"}'
  register: ceilometer_cr
  failed_when: false

- name: |
    TEST Verify the ceilometer custom resource is ready
  ansible.builtin.assert:
    that:
      - ceilometer_cr.stdout | default('') | trim == "True"
    success_msg: "the ceilometer CR reports Ready=True"
    fail_msg: >-
      the ceilometer CR reports Ready={{ ceilometer_cr.stdout | default('') | trim | default('<empty>', true) }},
      expected True

  # ignore_errors is inherited as true from the import_role in the CI playbook,
  # which would stop the rescue from ever running. Overriding it on the block
  # restores the diagnostic dump.
- name: Check that the autoscaling CR is ready
  ignore_errors: false
  block:
    - name: Verify that custom resource AUTOSCALING is ready
      ansible.builtin.command:
        cmd: |
          oc get autoscaling autoscaling -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}{"\n"}'
      register: autoscaling_cr
      failed_when:
        - autoscaling_cr.stdout != "True"
  rescue:
    - name: view autoscaling objects
      ansible.builtin.command:
        cmd: "{{ item }}"
      register: autoscaling_result
      with_items:
        - oc get autoscaling autoscaling -oyaml
        - oc get telemetry telemetry -oyaml
      failed_when: false

    - name: Print the result
      ansible.builtin.debug:
        var: autoscaling_result

- name: |
    TEST Verify the autoscaling custom resource is ready
  ansible.builtin.assert:
    that:
      - autoscaling_cr.stdout | default('') | trim == "True"
    success_msg: "the autoscaling CR reports Ready=True"
    fail_msg: >-
      the autoscaling CR reports Ready={{ autoscaling_cr.stdout | default('') | trim | default('<empty>', true) }},
      expected True

- name: Verify that custom resource METRICSTORAGE is ready
  ansible.builtin.command:
    cmd: |
      oc get metricstorage metric-storage -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}{"\n"}'
  register: metricstorage_cr
  failed_when: false

- name: |
    TEST Verify the metricstorage custom resource is ready
  ansible.builtin.assert:
    that:
      - metricstorage_cr.stdout | default('') | trim == "True"
    success_msg: "the metric-storage CR reports Ready=True"
    fail_msg: >-
      the metric-storage CR reports Ready={{ metricstorage_cr.stdout | default('') | trim | default('<empty>', true) }},
      expected True

