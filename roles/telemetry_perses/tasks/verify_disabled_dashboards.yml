---
- name: Check for disabled PersesDashboard {{ item }}
  ansible.builtin.command: >
    oc get persesdashboard {{ item }}
    -n {{ perses_project }}
  register: disabled_dashboard_results
  changed_when: false
  failed_when: false
  loop: "{{ perses_disabled_dashboards }}"

- name: TEST Verify disabled dashboard {{ item.item }} is not deployed
  ansible.builtin.assert:
    that:
      - item.rc != 0
    success_msg: "Dashboard {{ item.item }} correctly not deployed (disabled)"
    fail_msg: >-
      Dashboard {{ item.item }} exists but is in the
      disabledDashboards list
  loop: "{{ disabled_dashboard_results.results }}"
  loop_control:
    label: "{{ item.item }}"
