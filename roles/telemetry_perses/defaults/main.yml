---
#
# Namespace holding the PersesDashboard CRs, which is also the name
# of the project where dashboards are served by the Perses backend.
#
perses_project: openstack


#
# Settings for dashboards verification
#
# Note: the set membership is asserted, never a count, as some dashboards
#       are created only when the corresponding services are deployed;
#       those listed below are required to be present in the environment.
#
perses_expected_dashboards:
  - openstack-cloud
  - openstack-node
  - openstack-openstack-network
  - openstack-network-traffic
  - openstack-vm
  - openstack-rabbitmq
