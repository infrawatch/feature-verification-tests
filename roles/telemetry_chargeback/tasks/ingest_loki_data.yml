---
# Ingest data generated by gen_synth_loki_data.yml to Loki

- name: "TEST Push data to Loki {{ scenario_name }}"
  block:
    - name: "Copy data to OpenStack Client pod"
      ansible.builtin.command:
        cmd: "oc cp {{ cloudkitty_data_file }} {{ cloudkitty_namespace }}/{{ openstackpod }}:{{ loki_api_data_file }}"
      changed_when: false

    - name: "POST data to Loki through the internal Gateway Service"
      ansible.builtin.command:
        cmd: >
          oc exec -n {{ cloudkitty_namespace }} {{ openstackpod }} --
          curl -s -S --fail -o /dev/null -w '%{http_code}'
          --connect-timeout {{ loki_connect_timeout }}
          --max-time {{ loki_request_timeout }}
          -X POST -H 'Content-Type: application/json'
          --cert {{ loki_api_cert_dir }}/tls.crt
          --key {{ loki_api_cert_dir }}/tls.key
          --cacert {{ loki_api_cert_dir }}/service-ca.crt
          --data-binary @{{ loki_api_data_file }}
          {{ loki_push_url }}
      register: loki_response
      changed_when: loki_response.rc == 0

    - name: "Verify Loki accepted the pushed data"
      ansible.builtin.assert:
        that:
          - loki_response.stdout == '204'
        fail_msg: "Loki push returned HTTP {{ loki_response.stdout | default('no status') }}"
        success_msg: "Loki accepted the data for {{ scenario_name }}"

    - name: "Ingest Status Message"
      ansible.builtin.debug:
        msg: "Ingestion Successful for {{ scenario_name }}"

  rescue:
    - name: "IngestionFailed"
      ansible.builtin.fail:
        msg:
          - "Scenario: {{ scenario_name }}"
          - "Status: {{ loki_response.stdout | default('Unknown') }}"
          - "Error: {{ loki_response.stderr | default('No error output') }}"
          - "Message: {{ loki_response.msg | default('Request failed') }}"
