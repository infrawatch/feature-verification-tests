---
# This task retrieves ALL CloudKitty logs for the current month from Loki
# and generates a comprehensive rate summary. It runs after each scenario
# to validate the accumulated rating, enabling early failure detection.

- name: "Calculate current month time range (start to now) - {{ scenario_name }}"
  ansible.builtin.set_fact:
    month_start: >-
      {{ lookup('pipe', 'date -u +%Y-%m-01T00:00:00Z') }}
    month_start_ns: >-
      {{ (lookup('pipe', 'date -u +%Y-%m-01T00:00:00Z') |
         to_datetime('%Y-%m-%dT%H:%M:%S%z')).strftime('%s') | int * 1000000000 }}
    month_end: >-
      {{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S%z') }}
    month_end_ns: >-
      {{ ansible_date_time.epoch | int * 1000000000 }}

- name: "Set LogQL query for all CloudKitty data in current month - {{ scenario_name }}"
  ansible.builtin.set_fact:
    total_rate_logql_query: '{service="cloudkitty"}'

- name: "Debug: Show Loki query parameters for total_rate - {{ scenario_name }}"
  ansible.builtin.debug:
    msg:
      - "Query: {{ total_rate_logql_query }}"
      - "Start time (nanosec): {{ month_start_ns }}"
      - "End time (nanosec): {{ month_end_ns }}"
      - "Start time (human): {{ month_start }}"
      - "End time (human): {{ month_end }}"
      - "Limit: {{ limit }}"

# Query Loki for all data in current month
- name: "TEST Retrieve Logs from Loki via API - {{ scenario_name }}"
  block:
    - name: "Set remote response file path for total_rate"
      ansible.builtin.set_fact:
        remote_total_rate_file: "/tmp/loki_total_rate_{{ scenario_name }}.json"

    - name: "Query Loki API for current month data from inside the cluster - {{ scenario_name }}"
      ansible.builtin.command:
        cmd: >
          oc exec -n {{ cloudkitty_namespace }} {{ openstackpod }} --
          curl -sS -w '%{http_code}\n%{size_download}'
          --cert {{ remote_cert_dir }}/tls.crt
          --key {{ remote_cert_dir }}/tls.key
          --cacert {{ remote_cert_dir }}/service-ca.crt
          -H "X-Scope-OrgID: cloudkitty"
          -o {{ remote_total_rate_file }}
          "{{ loki_query_url }}?query={{ total_rate_logql_query | urlencode }}&start={{ month_start_ns }}&end={{ month_end_ns }}&limit={{ limit }}"
      register: loki_curl_response
      changed_when: false
      until: loki_curl_response.rc == 0 and loki_curl_response.stdout_lines[0] == '200' and loki_curl_response.stdout_lines[-1] | int > 0
      retries: 30
      delay: 10

    - name: "Copy Loki total_rate response from pod to local - {{ scenario_name }}"
      ansible.builtin.command:
        cmd: "oc cp {{ cloudkitty_namespace }}/{{ openstackpod }}:{{ remote_total_rate_file }} {{ cloudkitty_loki_totals_file }}"
      changed_when: false

    - name: "Load Loki total_rate response JSON - {{ scenario_name }}"
      ansible.builtin.slurp:
        src: "{{ cloudkitty_loki_totals_file }}"
      register: loki_response_raw

    - name: "Parse Loki total_rate response - {{ scenario_name }}"
      ansible.builtin.set_fact:
        loki_response_json: "{{ loki_response_raw.content | b64decode | from_json }}"

    - name: "Verify Loki total_rate response structure - {{ scenario_name }}"
      ansible.builtin.assert:
        that:
          - loki_response_json.status == 'success'
          - loki_response_json.data.result | length > 0
        fail_msg: "Loki total_rate query validation failed"
        success_msg: "Loki total_rate query successful"

    - name: "TEST Generate chargeback stats from Loki total_rate data - {{ scenario_name }}"
      ansible.builtin.command:
        cmd: >
          python3 "{{ cloudkitty_summary_script }}"
          -j "{{ cloudkitty_loki_totals_file }}"
          -o "{{ cloudkitty_loki_rating_summary_file }}"
          --debug "{{ cloudkitty_debug }}"
          --debug_dir "{{ cloudkitty_debug_dir }}"
      register: total_rate_summary
      changed_when: total_rate_summary.rc == 0

  rescue:
    - name: "Report Retrieval Failure for total_rate - {{ scenario_name }}"
      ansible.builtin.fail:
        msg:
          - "Failed to retrieve Loki total_rate data for current month"
          - "Query: {{ total_rate_logql_query }}"
          - "Start time: {{ month_start }}"
          - "HTTP Status: {{ loki_curl_response.stdout.strip().split('\n')[-1] | default('Unknown') }}"
          - "Return Code: {{ loki_curl_response.rc | default('Unknown') }}"
          - "Error: {{ loki_curl_response.stderr | default('No error output') }}"

# Display accumulated total rate for job
- name: "Display accumulated rating for job - {{ scenario_name }}"
  ansible.builtin.debug:
    msg: "Total rate for entire job across all scenarios: {{ total_rate_job }}"

# Get CloudKitty rating data for comparison
- name: "Get Rate and Qty by type from CloudKitty - {{ scenario_name }}"
  ansible.builtin.command:
    cmd: >-
      {{ openstack_cmd }} --rating-api-version 2
      rating summary get -f yaml -g type
  register: cost_totals_by_type
  changed_when: false
  failed_when: cost_totals_by_type.rc != 0

- name: "Print CloudKitty rating by type - {{ scenario_name }}"
  ansible.builtin.debug:
    var: cost_totals_by_type.stdout

- name: "Save CloudKitty rating by type to file - {{ scenario_name }}"
  ansible.builtin.copy:
    content: "{{ cost_totals_by_type.stdout }}"
    dest: "{{ cloudkitty_loki_rating_by_type_file }}"
    mode: '0644'

- name: "TEST Get Rate and Qty Summary from CloudKitty - {{ scenario_name }}"
  ansible.builtin.command:
    cmd: >-
      {{ openstack_cmd }} --rating-api-version 2
      rating summary get -f yaml
      -b "{{ job_earliest_start_time }}"
      -e "{{ job_latest_end_time }}"
  register: cost_totals_summary
  changed_when: false
  failed_when: cost_totals_summary.rc != 0

- name: "Print CloudKitty rating summary - {{ scenario_name }}"
  ansible.builtin.debug:
    var: cost_totals_summary.stdout

- name: "Get CloudKitty dataframes from Loki - {{ scenario_name }}"
  ansible.builtin.command:
    cmd: >-
      {{ openstack_cmd }} --rating-api-version 2
      rating dataframes get -f yaml
      -b "{{ job_earliest_start_time }}"
      -e "{{ job_latest_end_time }}"
  register: cost_dataframes
  changed_when: false
  failed_when: cost_dataframes.rc != 0

- name: "Save CloudKitty dataframes to file - {{ scenario_name }}"
  ansible.builtin.copy:
    content: "{{ cost_dataframes.stdout }}"
    dest: "{{ cloudkitty_loki_rating_dataframes_file }}"
    mode: '0644'

# Compare synthetic data rating against CloudKitty rating
- name: "Parse ratings for comparison - {{ scenario_name }}"
  ansible.builtin.set_fact:
    synth_rating: "{{ total_rate_job | float | round(4) }}"
    ck_rating: "{{ (cost_totals_summary.stdout | from_yaml)[0].Rate | float | round(4) }}"

- name: "Calculate tolerance - {{ scenario_name }}"
  ansible.builtin.set_fact:
    rating_diff: "{{ (synth_rating | float - ck_rating | float) | abs | round(4) }}"
    rating_tolerance: "{{ (synth_rating | float + ck_rating | float) * rating_tolerance_pct / 2 | round(4) }}"

- name: "TEST Assert synthetic rating matches CloudKitty rating - {{ scenario_name }}"
  ansible.builtin.assert:
    that:
      - rating_diff | float < rating_tolerance | float
    fail_msg: |
      FAILED -
      Synthetic rating ({{ synth_rating }}) does NOT match
      CloudKitty rating ({{ ck_rating }}).
      Difference: {{ rating_diff }} exceeds {{ rating_tolerance_pct | float * 100 }}% tolerance: {{ rating_tolerance }}
    success_msg: >-
      PASSED -
      Ratings match within {{ rating_tolerance_pct | float * 100 }}% tolerance.
      Synthetic: {{ synth_rating }}, CK: {{ ck_rating }},
      Diff: {{ rating_diff }}, Tolerance: {{ rating_tolerance }}
