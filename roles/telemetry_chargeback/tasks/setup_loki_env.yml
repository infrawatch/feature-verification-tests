---
# Setup Loki Environment

# Dynamic URL's
- name: "Get Loki Public Route Host"
  ansible.builtin.command:
    cmd: |
      oc get route cloudkitty-lokistack -n {{ cloudkitty_namespace }} -o "jsonpath={.spec.host}"
  register: loki_route
  changed_when: false

- name: "Set Loki URLs"
  ansible.builtin.set_fact:
    # Base URL
    loki_base_url: "https://{{ loki_route.stdout }}"

    # Internal Flush URL(Service DNS: https://<service>.<namespace>.svc:3100/flush)
    ingester_flush_url: "https://cloudkitty-lokistack-ingester-http.{{ cloudkitty_namespace }}.svc:3100/flush"

- name: "Set Derived Loki URLs"
  ansible.builtin.set_fact:
    loki_push_url: "{{ loki_base_url }}/api/logs/v1/cloudkitty/loki/api/v1/push"
    loki_query_url: "{{ loki_base_url }}/api/logs/v1/cloudkitty/loki/api/v1/query_range"

- name: "Debug URLs"
  ansible.builtin.debug:
    msg:
      - "Loki Route: {{ loki_base_url }}"
      - "Push URL:   {{ loki_push_url }}"
      - "Flush URL:  {{ ingester_flush_url }}"
      - "Query URL:  {{ loki_query_url }}"

- name: "Ensure Certificate Directories Exist"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0700'  # Restricted for security
  loop:
    - "{{ cert_dir }}"
    - "{{ local_cert_dir }}"
  when: item is defined

- name: "Extract Certificates from OpenShift Secret"
  ansible.builtin.command:
    cmd: |
      oc extract secret/{{ cert_secret_name }} --to={{ cert_dir }} --confirm -n {{ cloudkitty_namespace }}
  changed_when: true

- name: "Extract Client Certificates"
  ansible.builtin.command:
    cmd: |
      oc extract {{ client_secret }} --to={{ local_cert_dir }} --confirm -n {{ cloudkitty_namespace }}
  changed_when: true

- name: "Extract CA Bundle"
  ansible.builtin.command:
    cmd: |
      oc extract {{ ca_configmap }} --to={{ local_cert_dir }} --confirm -n {{ cloudkitty_namespace }}
  changed_when: true

# Wait for Loki gossip ring to converge before ingesting data.
# When the ring hasn't converged, ingesters accept writes but are
# invisible to queriers, causing queries to return empty results.
# Uses oc exec because the ingester service DNS is only resolvable
# from inside the cluster.
- name: "Create cert directory in OpenStack Client pod"
  ansible.builtin.command:
    cmd: "oc exec -n {{ cloudkitty_namespace }} {{ openstackpod }} -- mkdir -p {{ remote_cert_dir }}"
  changed_when: false

- name: "Copy certificates to OpenStack Client pod"
  ansible.builtin.command:
    cmd: "oc cp {{ local_cert_dir }}/. {{ cloudkitty_namespace }}/{{ openstackpod }}:{{ remote_cert_dir }}/"
  changed_when: false

- name: "Wait for Loki ring to converge"
  ansible.builtin.command:
    cmd: >
      oc exec -n {{ cloudkitty_namespace }} {{ openstackpod }} --
      curl -s
      --cert {{ remote_cert_dir }}/tls.crt
      --key {{ remote_cert_dir }}/tls.key
      --cacert {{ remote_cert_dir }}/service-ca.crt
      https://cloudkitty-lokistack-ingester-http.{{ cloudkitty_namespace }}.svc:3100/ring
  register: ring_response
  until:
    - ring_response.rc == 0
    - "'JOINING' not in ring_response.stdout"
    - "'PENDING' not in ring_response.stdout"
    - "'LEAVING' not in ring_response.stdout"
  retries: 20
  delay: 15
  changed_when: false
