---
- name: "Set LogQL query for {{ scenario_name }}"
  ansible.builtin.set_fact:
    scenario_logql_query: '{service="cloudkitty"}'

- name: "Calculate Loki query start and end times in nanoseconds"
  ansible.builtin.set_fact:
    scenario_start_ns: "{{ ((synth_data_rates.time.begin_step.begin | to_datetime('%Y-%m-%dT%H:%M:%S%z')).strftime('%s') | int * 1000000000) }}"
    scenario_end_ns: "{{ ((synth_data_rates.time.end_step.end | to_datetime('%Y-%m-%dT%H:%M:%S%z')).strftime('%s') | int * 1000000000) }}"

- name: "Debug: Show Loki query parameters for {{ scenario_name }}"
  ansible.builtin.debug:
    msg:
      - "Query: {{ scenario_logql_query }}"
      - "Start time (nanosec): {{ scenario_start_ns }}"
      - "Start time (human): {{ synth_data_rates.time.begin_step.begin }}"
      - "End time (nanosec): {{ scenario_end_ns }}"
      - "End time (human): {{ synth_data_rates.time.end_step.end }}"
      - "Expected log count: {{ synth_data_rates.data_summary.log_count }}"
  when: cloudkitty_debug | bool

- name: "Expected Count {{ scenario_name }}"
  ansible.builtin.debug:
    msg: "Input file has {{ synth_data_rates.data_summary.log_count }} data entries that Loki has to return"

# Query Loki
- name: "Retrieve Logs from Loki via API {{ scenario_name }}"
  block:
    - name: "Show the Loki query URL"
      ansible.builtin.debug:
        msg: "{{ loki_query_url }}?query={{ scenario_logql_query | urlencode }}&start={{ scenario_start_ns }}&end={{ scenario_end_ns }}&limit={{ limit }}"

    - name: "Set remote response file path"
      ansible.builtin.set_fact:
        remote_loki_response_file: "/tmp/loki_response_{{ scenario_name }}.json"

    - name: "Query Loki API from inside the cluster"
      ansible.builtin.command:
        cmd: >
          oc exec -n {{ cloudkitty_namespace }} {{ openstackpod }} --
          curl -sS -w '%{http_code}\n%{size_download}'
          --cert {{ remote_cert_dir }}/tls.crt
          --key {{ remote_cert_dir }}/tls.key
          --cacert {{ remote_cert_dir }}/service-ca.crt
          -H "X-Scope-OrgID: cloudkitty"
          -o {{ remote_loki_response_file }}
          "{{ loki_query_url }}?query={{ scenario_logql_query | urlencode }}&start={{ scenario_start_ns }}&end={{ scenario_end_ns }}&limit={{ limit }}"
      register: loki_curl_response
      changed_when: false
      # Wait for Loki to return all expected log entries
      until: loki_curl_response.rc == 0 and loki_curl_response.stdout_lines[0] == '200' and loki_curl_response.stdout_lines[-1] | int > 0
      retries: 6
      delay: 10

    - name: "Copy Loki response from pod to local"
      ansible.builtin.command:
        cmd: "oc cp {{ cloudkitty_namespace }}/{{ openstackpod }}:{{ remote_loki_response_file }} {{ cloudkitty_loki_data_file }}"
      changed_when: false

    - name: "Load Loki response JSON"
      ansible.builtin.slurp:
        src: "{{ cloudkitty_loki_data_file }}"
      register: loki_response_raw

    - name: "Parse Loki response"
      ansible.builtin.set_fact:
        loki_response_json: "{{ loki_response_raw.content | b64decode | from_json }}"

    - name: "Verify Loki response structure and data count"
      vars:
        actual_count: "{{ loki_response_json.data.result | map(attribute='values') | map('length') | sum }}"
      ansible.builtin.assert:
        that:
          - loki_response_json.status == 'success'
          - loki_response_json.data.result | length > 0
          - actual_count | int >= (synth_data_rates.data_summary.log_count | int)
        fail_msg: >-
          Loki query validation failed. Expected at least
          {{ synth_data_rates.data_summary.log_count }} log entries,
          but got {{ actual_count }}
        success_msg: >-
          Loki query successful. Retrieved {{ actual_count }} log entries

    # Validate exact count
    - name: "TEST Verify Data Integrity {{ scenario_name }}"
      vars:
        actual_count: "{{ loki_response_json.data.result | map(attribute='values') | map('length') | sum }}"
      ansible.builtin.assert:
        that:
          - actual_count | int == (synth_data_rates.data_summary.log_count | int)
        fail_msg: >-
          Query did not return all data entries. Expected
          {{ synth_data_rates.data_summary.log_count }} log entries, but Loki
          only returned {{ actual_count }}
        success_msg: >-
          Query returned all data entries. Input file had
          {{ synth_data_rates.data_summary.log_count }} entries and Loki
          returned {{ actual_count }}

    # Only runs if retrieval was successful
    - name: "TEST Generate chargeback stats from Loki-retrieved data file: {{ scenario_name }}"
      ansible.builtin.command:
        cmd: >
          python3 "{{ cloudkitty_summary_script }}"
          -j "{{ cloudkitty_loki_data_file }}"
          -o "{{ cloudkitty_loki_summary_metrics_file }}"
          --debug "{{ cloudkitty_debug }}"
          --debug_dir "{{ cloudkitty_debug_dir }}"
      register: synth_rating_info
      changed_when: synth_rating_info.rc == 0

  rescue:
    - name: "Report Retrieval Failure"
      ansible.builtin.fail:
        msg:
          - "Failed to retrieve Loki data for {{ scenario_name }}"
          - "HTTP Status: {{ loki_curl_response.stdout.strip().split('\n')[-1] | default('Unknown') }}"
          - "Return Code: {{ loki_curl_response.rc | default('Unknown') }}"
          - "Error: {{ loki_curl_response.stderr | default('No error output') }}"
