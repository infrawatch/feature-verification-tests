---
# Scenario configuration for synthetic Loki log data generation
# Scenario configuration for CloudKitty chargeback testing

# Time range configuration
generation:
  days: 1/24
  step_seconds: 300

# Log type definitions (single "type" = identifier and value pushed to output)
log_types:
  - type: ceilometer_image_test
    description: "Size of ceilometer test"
    unit: MiB
    qty:
      - 909
    unit_cost:
      - 0.00009
    groupby:
      resource: cloudkitty
      user: null
      project: null
    metadata:
      container_format: bare
      disk_format: qcow2

  - type: ceilometer_cpu
    description: "max number of cpus used in time step"
    unit: instance
    alt_name: instance
    qty:
      - 1
    unit_cost:
      - 5.00
    groupby:
      resource: cloudkitty
      user: null
      project: null
      flavor_name: null
      flavor_id: null
    mutate: NUMBOOL

  - type: ceilometer_ip_floating
    description: null
    unit: ip
    qty:
      - 5
    unit_cost:
      - 1.00
    groupby:
      resource: cloudkitty
      user: null
      project: null
    metadata:
      state: null
    mutate: NUMBOOL

  - type: ceilometer_disk_root_size
    description: null
    unit: GiB
    qty:
      - 3000
    # $0.023/GiB/month → per 300s: 0.023 / 8640
    unit_cost:
      - 0.000003
    groupby:
      resource: cloudkitty
      user: null
      project: null
    metadata:
      type: null

  - type: ceilometer_network_outgoing_bytes
    description: null
    unit: MiB
    qty:
      - 0.0
    unit_cost:
      - 0.00009
    groupby:
      resource: cloudkitty
      user: null
      project: null
    metadata:
      vm_instance: null

  - type: ceilometer_network_incoming_bytes
    description: null
    unit: MiB
    qty:
      - 1000
    unit_cost:
      - 0.00009
    groupby:
      resource: cloudkitty
      user: null
      project: null
    metadata:
      vm_instance: null

# Required fields for validation (top-level fields only, not nested in groupby)
required_fields:
  - type
  - unit
  - qty
  - unit_cost
  - groupby

# Date field names to add to groupby
date_fields:
  - week_of_the_year
  - day_of_the_year
  - month
  - year

# Loki stream configuration
loki_stream:
  service: cloudkitty
