# Scenario configuration for synthetic Loki log data generation
# Scenario configuration for CloudKitty chargeback testing

# Time range configuration
generation:
  days: 1/24
  step_seconds: 300

# Log type definitions
log_types:
  - name: ceilometer_image_size
    type: ceilometer_image_size
    unit: MiB
    description: null
    qty: 2324
    unit_cost: 0.00009
    groupby:
      resource: cloudkitty
      project: null
      user: null
    metadata:
      container_format: bare
      disk_format: qcow2

  - name: instance
    type: instance
    unit: instance
    description: null
    qty: 1.0
    unit_cost: 0.3
    groupby:
      resource: cloudkitty
      project: null
      user: null
    metadata:
      flavor_name: m1.tiny
      flavor_id: "1"
      vcpus: ""

# Required fields for validation (top-level fields only, not nested in groupby)
required_fields:
  - type
  - unit
  - qty
  - unit_cost
  - groupby
  - metadata

# Date field names to add to groupby
date_fields:
  - week_of_the_year
  - day_of_the_year
  - month
  - year

# Loki stream configuration
loki_stream:
  service: cloudkitty
