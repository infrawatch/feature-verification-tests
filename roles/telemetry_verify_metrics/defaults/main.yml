---
telemetry_verify_metrics_metric_sources_to_test:
  - ceilometer_compute_agent
  - ceilometer_central_agent
  - ksm
  - node_exporter
  - podman_exporter
  - rabbitmq
  - openstack_network_exporter
  - ceilometer_prom_exporter
  - mariadb
  - ovn
  # NOTE: IPMI metrics can only be verified when compute nodes are baremetal
  # - ceilometer_ipmi_agent
  # NOTE: volume pool metrics can only be verified when a pool with a correct backend is configured
  # - volume_pool

# Latches to false when the shared prerequisite probe fails. The per-source
# metric queries are then skipped and their TEST asserts report a BLOCKED
# failure instead of burning their retry budgets. Role-internal only.
verify_metrics_prereqs_ok: true
verify_metrics_blocked_msg: >-
  BLOCKED: metrics could not be queried from Prometheus, so this check was not attempted
