- name: Get ovn-northd metric services
  ansible.builtin.shell: |
    oc get svc -l service=ovn-northd,metrics=enabled -o name -n openstack
  register: ovn_northd_metric
  changed_when: false

- name: Verify ovn-northd scrapeconfig exists
  ansible.builtin.include_role:
    name: common
  vars:
    common_cr_list:
      - kind: scrapeconfigs.monitoring.rhobs
        name: telemetry-ovn-northd
  when: ovn_northd_metric.stdout != ""

- name: |
    TEST Use openstack observabilityclient to verify ovn-northd metrics are stored in prometheus
  vars:
    ovn_northd_metrics:
      - ovn_northd_status
      - ovn_northd_pstream_open_total
      - ovn_northd_stream_open_total
      - ovn_northd_txn_incomplete_total
      - ovn_northd_txn_success_total
      - ovn_northd_txn_unchanged_total
  ansible.builtin.shell: |
    {{ openstack_cmd }} metric show --disable-rbac {{ item }}
  register: result
  delay: 30
  retries: 10
  changed_when: false
  until: result.rc == 0 and item in result.stdout
  loop: "{{ ovn_northd_metrics }}"
  when: ovn_northd_metric.stdout != ""

- name: Get ovn-controller metric services
  ansible.builtin.shell: |
    oc get svc -l service=ovn-controller-metrics,metrics=enabled -o name -n openstack
  register: ovn_controller_metric
  changed_when: false

- name: Verify ovn-controller scrapeconfig exists
  ansible.builtin.include_role:
    name: common
  vars:
    common_cr_list:
      - kind: scrapeconfigs.monitoring.rhobs
        name: telemetry-ovn-controller
  when: ovn_controller_metric.stdout != ""

  # Read the targets from the ScrapeConfigs so each check follows the
  # deployment instead of assuming a fixed port.
- name: Get the ovn-controller scrape targets
  ansible.builtin.command: >-
    oc get scrapeconfig.monitoring.rhobs -n openstack telemetry-ovn-controller
    --ignore-not-found
    -o jsonpath='{range .spec.staticConfigs[*]}{.targets[*]}{"\n"}{end}'
  register: ovn_controller_targets
  changed_when: false

- name: Get the openstack network exporter scrape targets
  ansible.builtin.command: >-
    oc get scrapeconfig.monitoring.rhobs -n openstack
    telemetry-openstack-network-exporter telemetry-openstack-network-exporter-tls
    --ignore-not-found
    -o jsonpath='{range .items[*]}{range .spec.staticConfigs[*]}{.targets[*]}{"\n"}{end}{end}'
  register: ovn_network_exporter_targets
  changed_when: false

  # A "." in a Prometheus label regex matches any character, and this client
  # does not preserve backslash escapes, so match literal dots with "[.]".
- name: Set the ovn controller scrape target patterns
  ansible.builtin.set_fact:
    ovn_controller_targets_regex: >-
      {{ ovn_controller_targets.stdout.split()
         | map('replace', '.', '[.]') | join('|') }}
    ovn_network_exporter_targets_regex: >-
      {{ ovn_network_exporter_targets.stdout.split()
         | map('replace', '.', '[.]') | join('|') }}

- name: Query ovn controller metrics from the controller exporter
  ansible.builtin.shell: |
    {{ openstack_cmd }} metric query '{{ item }}{instance=~"{{ ovn_controller_targets_regex }}"}' -f value
  register: ovn_controller_ovs_result
  delay: 30
  retries: 10
  changed_when: false
  ignore_errors: true
  until: ovn_controller_ovs_result.rc == 0 and item in ovn_controller_ovs_result.stdout
  loop: "{{ ovn_controller_ovs_metrics }}"
  when: ovn_controller_metric.stdout != ""

- name: Query ovn controller metrics from the openstack network exporter
  ansible.builtin.shell: |
    {{ openstack_cmd }} metric query '{{ item }}{instance=~"{{ ovn_network_exporter_targets_regex }}"}' -f value
  register: ovn_controller_network_result
  delay: 30
  retries: 10
  changed_when: false
  ignore_errors: true
  until: ovn_controller_network_result.rc == 0 and item in ovn_controller_network_result.stdout
  loop: "{{ ovn_controller_network_metrics_all }}"
  when: ovn_controller_metric.stdout != ""

  # Both queries feed this TEST, so their failed metrics are merged into one
  # message: the metrics not found on the target they belong to.
- name: |
    TEST Use openstack observabilityclient to verify ovn controller metrics are stored in prometheus
  ansible.builtin.assert:
    that:
      - ovn_controller_ovs_result is not skipped
      - ovn_controller_ovs_result is not failed
      - ovn_controller_network_result is not skipped
      - ovn_controller_network_result is not failed
    success_msg: "all ovn controller metrics are stored in prometheus and scraped from their configured scrape targets"
    fail_msg: >-
      ovn controller metrics not found in prometheus from their configured scrape targets:
      {{ ((ovn_controller_ovs_result.results | default([]))
          + (ovn_controller_network_result.results | default([])))
         | selectattr('failed', 'defined') | selectattr('failed')
         | map(attribute='item') | unique | join(', ') }}
  when: ovn_controller_metric.stdout != ""

- name: Get RAFT metric services
  ansible.builtin.shell: |
    oc get svc -n openstack -o name \
      -l 'service in (ovsdbserver-nb, ovsdbserver-sb)',metrics=enabled
  register: ovn_raft_metric
  changed_when: false

- name: Verify RAFT scrapeconfig exists
  ansible.builtin.include_role:
    name: common
  vars:
    common_cr_list:
      - kind: scrapeconfigs.monitoring.rhobs
        name: telemetry-ovsdbserver-nb
      - kind: scrapeconfigs.monitoring.rhobs
        name: telemetry-ovsdbserver-sb
  when: ovn_raft_metric.stdout != ""

  # Read the targets from the ScrapeConfigs and query by instance instead.
- name: Get the RAFT scrape targets
  ansible.builtin.command: >-
    oc get scrapeconfig.monitoring.rhobs -n openstack
    telemetry-ovsdbserver-nb telemetry-ovsdbserver-sb
    --ignore-not-found
    -o jsonpath='{range .items[*]}{range .spec.staticConfigs[*]}{.targets[*]}{"\n"}{end}{end}'
  register: ovn_raft_targets
  changed_when: false

  # A "." in a Prometheus label regex matches any character and this client
  # does not preserve backslash escapes, so match literal dots with "[.]".
- name: Set the RAFT scrape target pattern
  ansible.builtin.set_fact:
    ovn_raft_targets_regex: >-
      {{ ovn_raft_targets.stdout.split()
         | map('replace', '.', '[.]') | join('|') }}

- name: |
    TEST Use openstack observabilityclient to verify RAFT metrics are stored in prometheus
  ansible.builtin.shell: |
    {{ openstack_cmd }} metric query '{{ item }}{instance=~"{{ ovn_raft_targets_regex }}"}' -f value
  register: result
  delay: 30
  retries: 10
  changed_when: false
  until: result.rc == 0 and item in result.stdout
  loop: "{{ ovn_raft_metrics }}"
  when: ovn_raft_metric.stdout != ""
