---
- name: Run telemetry autoscaling tests on osp18
  hosts:  "{{ cifmw_target_hook_host | default('localhost')  }}"
  gather_facts: true
  environment:
    KUBECONFIG: "{{ fvt_kubeconfig }}"
    PATH: "{{ fvt_path }}"
  vars_files:
    - vars/defaults.yml
    - vars/common.yml
    - vars/osp18_env.yml
  pre_tasks:
    - name: "Notify if autoscaling test is skipped by run_autoscaling_test false"
      ansible.builtin.debug:
        msg: "Skipping the autoscaling test because run_autoscaling_test extra_vars is set to false"
      when: not run_autoscaling_test | default(true) | bool

    - name: "Skip autoscaling test by run_autoscaling_test false"
      ansible.builtin.meta: end_play
      when: not run_autoscaling_test | default(true) | bool

    - name: "Get OpenStackControlPlane autoscaling status"
      ansible.builtin.command: >
        oc get oscp -n openstack -o jsonpath='{.items[0].spec.telemetry.template.autoscaling.enabled}'
      register: autoscaling_status
      changed_when: false

    - name: "Set fact if autoscaling is enabled"
      ansible.builtin.set_fact:
        autoscaling_enabled: "{{ autoscaling_status.stdout | trim | lower == 'true' }}"

    - name: "Notify if autoscaling test is skipped by autoscaling status"
      ansible.builtin.debug:
        msg: "Skipping the autoscaling test because OpenStackControlPlane telemetry autoscaling is disabled"
      when: not autoscaling_enabled | bool

    - name: "Skip autoscaling test by autoscaling disabled"
      ansible.builtin.meta: end_play
      when: not autoscaling_enabled | bool

  tasks:
    - block:
        - name: Check whether the extra_vars parameters directory exists
          ansible.builtin.stat:
            path: "{{ fvt_basedir }}/artifacts/parameters"
          register: fvt_parameters_dir

        - name: Include vars from the extra_vars files
          ansible.builtin.include_vars:
            dir: "{{ fvt_basedir }}/artifacts/parameters"
          when: fvt_parameters_dir.stat.isdir | default(false)

        - name: Create the instance the autoscaling tests scale from
          community.general.make:
            chdir: >-
              {%- if zuul is defined -%}
              {{ lookup('env', 'HOME') }}/{{ zuul.projects["github.com/openstack-k8s-operators/install_yamls"].src_dir }}/devsetup
              {%- else -%}
              {{ install_yamls_dir }}/devsetup
              {%- endif -%}
            target: edpm_deploy_instance
          when: fvt_create_test_vm | bool
          tags:
            - setup

        - name: Patch observabilityclient into openstackclient
          ansible.builtin.shell:
            cmd: |
              oc exec -n openstack openstackclient -- python3 -m ensurepip --upgrade
              oc exec -n openstack openstackclient -- python3 -m pip install --upgrade aodhclient
              oc exec -n openstack openstackclient -- python3 -m pip install --upgrade python-observabilityclient
          when: patch_observabilityclient | default(false) | bool
          tags:
            - setup

        - name: "Run Telemetry Autoscaling tests"
          ansible.builtin.import_role:
            name: telemetry_autoscaling
          vars:
            telemetry_autoscaling_cleanup: false
          ignore_errors: true

        - name: "Run Telemetry Verify Metrics tests"
          ansible.builtin.import_role:
            name: telemetry_verify_metrics
          ignore_errors: true

      always:
        - name: "Run Telemetry Autoscaling cleanup"
          ansible.builtin.include_role:
            name: telemetry_autoscaling
            tasks_from: post_teardown

        - name: Delete test_0 VM
          ansible.builtin.command:
            cmd: "{{ openstack_cmd }} server delete test_0"
          register: fvt_delete_test_0
          changed_when: fvt_delete_test_0.rc == 0
          # The VM is absent when the tests were not run against a locally
          # created instance; that is not a failure.
          failed_when: false
