---
- name: "Run functional test playbooks"
  hosts:  "{{ cifmw_target_hook_host | default('localhost')  }}"
  gather_facts: true
  environment:
    KUBECONFIG: "{{ cifmw_openshift_kubeconfig }}"
    PATH: "{{ cifmw_path }}"
  vars:
    USERNAME: "{{ cifmw_openshift_user }}"
    PASSWORD: "{{ cifmw_openshift_password }}"
  vars_files:
    - vars/common.yml
  pre_tasks:
    - name: "Notify if graphing test is skipped by run_graphing_test false"
      ansible.builtin.debug:
        msg: "Skipping the graphing test because run_graphing_test extra_vars is set to false"
      when: not run_graphing_test | default(true) | bool

    - name: "Skip graphing test by run_graphing_test false"
      ansible.builtin.meta: end_play
      when: not run_graphing_test | default(true) | bool

    # Note: telemetry-operator has moved to Perses-based dashboards, however
    #       the switch that enables them remains the same as for legacy ones.
    #       The Perses change introduced a new `disabledDashboards` option,
    #       so we guard on its presence whether to run legacy tests.
    #       The option is omitempty, so we probe the CRD schema, not the CR.
    - name: Check if telemetry-operator supports disabledDashboards
      ansible.builtin.command: >
        oc get crd metricstorages.telemetry.openstack.org
        -o jsonpath='{.spec.versions[*].schema.openAPIV3Schema.properties.spec.properties.disabledDashboards}'
      register: disabled_dashboards_schema
      changed_when: false

    - name: Set fact if dashboards are Perses-based
      ansible.builtin.set_fact:
        perses_dashboards: "{{ (disabled_dashboards_schema.stdout | length > 0) | bool }}"

    - name: Notify if graphing test is skipped by Perses dashboards
      ansible.builtin.debug:
        msg: >-
          Skipping the legacy graphing test
          because telemetry-operator serves Perses dashboards,
          not the OpenShift Console-native ones.
      when: perses_dashboards

    - name: Skip graphing test by Perses dashboards
      ansible.builtin.meta: end_play
      when: perses_dashboards

    - name: "Get OpenStackControlPlane telemetry dashboardsEnabled status"
      ansible.builtin.command: >
        oc get oscp -n openstack -o jsonpath='{.items[0].spec.telemetry.template.metricStorage.dashboardsEnabled}'
      register: dashboard_status
      changed_when: false

    - name: "Set fact if dashboards are enabled"
      ansible.builtin.set_fact:
        dashboards_enabled: "{{ dashboard_status.stdout | trim | lower == 'true' }}"

    - name: "Notify if graphing test is skipped by dashboardsEnabled status"
      ansible.builtin.debug:
        msg: "Skipping the graphing test because OpenStackControlPlane telemetry dashboards are disabled"
      when: not dashboards_enabled | bool

    - name: "Skip graphing test by dashboardsEnabled disabled"
      ansible.builtin.meta: end_play
      when: not dashboards_enabled | bool
  tasks:
    - block:
        - name: "Run Graphing Console UI tests"
          ansible.builtin.import_role:
            name: telemetry_graphing
          ignore_errors: true