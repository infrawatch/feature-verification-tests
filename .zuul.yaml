---
- nodeset:
    name: telemetry-operator-all-the-features
    # Use a larger crc with the nodeset for the parent job to account
    # for openshift monitoring and autoscaling features being deployed.
    # Original nodeset: centos-9-medium-centos-9-crc-cloud-ocp-4-20-1-3xl
    # Defined in: openstack-k8s-operators/ci-framework
    #   Job: cifmw-podified-multinode-edpm-base-crc
    nodes:
      - name: controller
        label: cloud-centos-9-stream-tripleo-medium
      - name: compute-0
        label: cloud-centos-9-stream-tripleo
      - name: crc
        label: crc-cloud-ocp-4-20-1-4xl
    groups:
      - name: computes
        nodes:
          - compute-0
      - name: ocps
        nodes:
          - crc

- job:
    name: telemetry-container-image-content-provider
    parent: cifmw-base-minimal
    description: |
      Build sg-core, prometheus-podman-exporter and mysqld-exporter
      container images from the current change and serve them from
      a local registry for dependent jobs.
    required-projects:
      - name: github.com/openstack-k8s-operators/ci-framework
        override-checkout: main
      - name: github.com/openstack-k8s-operators/sg-core
        override-checkout: main
      - name: github.com/openstack-k8s-operators/prometheus-podman-exporter
        override-checkout: main
      - name: github.com/openstack-k8s-operators/mysqld_exporter
        override-checkout: main
    run:
      - ci/playbooks/container-image-content-provider.yml
    vars:
      container_images:
        - src: "{{ ansible_user_dir }}/src/github.com/openstack-k8s-operators/sg-core"
          name: sg-core
          update_var: cifmw_update_containers_ceilometersgcoreImage
        - src: "{{ ansible_user_dir }}/src/github.com/openstack-k8s-operators/prometheus-podman-exporter"
          name: prometheus-podman-exporter
          update_var: cifmw_update_containers_edpmpodmanexporterImage
        - src: "{{ ansible_user_dir }}/src/github.com/openstack-k8s-operators/mysqld_exporter"
          name: mysqld-exporter
          update_var: cifmw_update_containers_ceilometermysqldexporterImage

- job:
    name: functional-tests
    dependencies:
      - name: telemetry-container-image-content-provider
        soft: true
    parent: telemetry-operator-multinode-autoscaling
    nodeset: telemetry-operator-all-the-features
    abstract: true
    description: |
      Run autoscaling functional tests, tempest tests, metrics
      functional tests, graphing functional tests and logging functional tests
    vars:
      # Enable update containers so that we have updated containers for mysqld_exporter, prometheus-podman-exporter and sg-core
      cifmw_update_containers: true
      # Don't update openstack service containers since we don't have a content provider which would provide these images
      cifmw_update_containers_openstack: false
      crc_enable_monitoring: true
      cifmw_extras_base:
        - "@{{ ansible_user_dir }}/{{ zuul.projects['github.com/openstack-k8s-operators/ci-framework'].src_dir }}/scenarios/centos-10/multinode-ci.yml"
        - "@{{ ansible_user_dir }}/{{ zuul.projects['github.com/openstack-k8s-operators/telemetry-operator'].src_dir }}/ci/vars-autoscaling.yml"
        - "@{{ ansible_user_dir }}/{{ zuul.projects['github.com/openstack-k8s-operators/telemetry-operator'].src_dir }}/ci/vars-logging.yml"
        - "@{{ ansible_user_dir }}/{{ zuul.projects['github.com/openstack-k8s-operators/telemetry-operator'].src_dir }}/ci/vars-power-monitoring.yml"
        - "@{{ ansible_user_dir }}/{{ zuul.projects['github.com/infrawatch/feature-verification-tests'].src_dir }}/ci/vars-logging-test.yml"
        - "@{{ ansible_user_dir }}/{{ zuul.projects['github.com/openstack-k8s-operators/telemetry-operator'].src_dir }}/ci/vars-autoscaling-tempest.yml"
        - "@{{ ansible_user_dir }}/{{ zuul.projects['github.com/infrawatch/feature-verification-tests'].src_dir }}/ci/vars-functional-test.yml"
    roles:
      - zuul: github.com/openstack-k8s-operators/ci-framework
    required-projects: &required_projects
      - name: github.com/infrawatch/service-telemetry-operator
      - name: github.com/openstack-k8s-operators/ci-framework
        override-checkout: main
      - name: github.com/openstack-k8s-operators/install_yamls
        override-checkout: main
      - name: github.com/openstack-k8s-operators/dataplane-operator
        override-checkout: main
      - name: github.com/openstack-k8s-operators/infra-operator
        override-checkout: main
      - name: github.com/openstack-k8s-operators/openstack-operator
        override-checkout: main
      - name: github.com/openstack-k8s-operators/openstack-must-gather
        override-checkout: main
      - name: github.com/openstack-k8s-operators/telemetry-operator
        override-checkout: main
      - name: github.com/openstack-k8s-operators/sg-core
        override-checkout: main
      - name: github.com/openstack-k8s-operators/prometheus-podman-exporter
        override-checkout: main
      - name: github.com/openstack-k8s-operators/mysqld_exporter
        override-checkout: main
    irrelevant-files: &irrelevant_files
      - .github/.*
      - ci/github/.*
      - callback_plugins/.*
      - README*
      - OWNERS*
      - .*/*.md
      - roles/client_side_tests/.*
      - roles/test_alerts/.*
      - roles/test_collectd/.*
      - roles/test_metrics_retention/.*
      - roles/test_observability_strategy/.*
      - roles/test_qdr/.*
      - roles/test_sensubility/.*
      - roles/test_snmp_traps/.*
      - roles/test_verify_email/.*

- job:
    name: functional-tests-osp19
    dependencies:
      - name: s2i-openstack-container-content-provider
        soft: true
      - name: telemetry-container-image-content-provider
        soft: true
    parent: functional-tests
    description: |
      Run autoscaling functional tests, tempest tests, metrics
      functional tests, graphing functional tests and logging functional tests on
      osp19
    vars:
      cifmw_crc_additional_insecure_registries: "{{ [s2i_content_provider_registry_ip ~ ':5001'] if s2i_content_provider_registry_ip is defined else [] }}"
      cifmw_crc_additional_allowed_registries: "{{ [s2i_content_provider_registry_ip ~ ':5001'] if s2i_content_provider_registry_ip is defined else [] }}"
      cifmw_set_containers_preserve_unlisted: true
      cifmw_set_containers_images: >-
        {{ (s2i_content_provider_os_custom_container_images |
           dict2items |
           json_query('[].{name: key, full_registry: value}'))
           if s2i_content_provider_os_custom_container_images is defined else [] }}
      cifmw_extras: "{{ [
        cifmw_extras_base_extra | default([]),
        cifmw_extras_scenario | default([])
      ] | flatten }}"

- job:
    name: functional-logging-tests
    parent: telemetry-operator-multinode-logging
    description: |
      Run the logging functional tests and tempest smoketests.
    abstract: true
    extra-vars: *functional_autoscaling_extra_vars
    vars:
      cifmw_update_containers: false
      cifmw_extras:
        - "@{{ ansible_user_dir }}/{{ zuul.projects['github.com/openstack-k8s-operators/ci-framework'].src_dir  }}/scenarios/centos-10/multinode-ci.yml"
        - "@{{ ansible_user_dir }}/{{ zuul.projects['github.com/openstack-k8s-operators/telemetry-operator'].src_dir }}/ci/vars-logging.yml"
          # Use the tempest config we have for autoscaling tests
        - "@{{ ansible_user_dir }}/{{ zuul.projects['github.com/openstack-k8s-operators/telemetry-operator'].src_dir }}/ci/vars-autoscaling-tempest.yml"
          # There's an override in here to modify the enabled tests to include only the smoke tests
        - "@{{ ansible_user_dir }}/{{ zuul.projects['github.com/infrawatch/feature-verification-tests'].src_dir }}/ci/vars-logging-test.yml"
    roles:
      - zuul: github.com/openstack-k8s-operators/ci-framework
    required-projects: *required_projects

- job:
    name: functional-logging-tests-osp19
    parent: functional-logging-tests
    dependencies:
      - name: s2i-openstack-container-content-provider
        soft: true
    vars:
      cifmw_crc_additional_insecure_registries: "{{ [s2i_content_provider_registry_ip ~ ':5001'] if s2i_content_provider_registry_ip is defined else [] }}"
      cifmw_crc_additional_allowed_registries: "{{ [s2i_content_provider_registry_ip ~ ':5001'] if s2i_content_provider_registry_ip is defined else [] }}"
      cifmw_set_containers_preserve_unlisted: true
      cifmw_set_containers_images: >-
        {{ (s2i_content_provider_os_custom_container_images |
           dict2items |
           json_query('[].{name: key, full_registry: value}'))
           if s2i_content_provider_os_custom_container_images is defined else [] }}

- job:
    name: feature-verification-tests-noop
    description: |
      A job that always passes. Runs when there's a change to jobs that don't
      need full zuul to run but still need to report a pass.
    run:
      - ci/noop.yml

- job:
    name: functional-periodic-telemetry-with-ceph
    parent: podified-multinode-hci-deployment-crc-1comp-backends
    dependencies: ["telemetry-openstack-meta-content-provider-master"]
    nodeset: telemetry-operator-all-the-features
    description: |
      Deploy OpenStack with Telemetry and Ceph. Run metric-verification with volume pool metric tests
    extra-vars: *functional_autoscaling_extra_vars
    vars:
      run_graphing_test: false
      patch_observabilityclient: true
      cifmw_update_containers: false
      telemetry_verify_metrics_metric_sources_to_test:
        - ceilometer_compute_agent
        - ceilometer_central_agent
        - ksm
        - node_exporter
        - podman_exporter
        - rabbitmq
        - openstack_network_exporter
        - mariadb
        - volume_pool
        - ovn
      cifmw_extras:
        - "@{{ ansible_user_dir }}/{{ zuul.projects['github.com/openstack-k8s-operators/ci-framework'].src_dir  }}/scenarios/centos-10/multinode-ci.yml"
        - "@{{ ansible_user_dir }}/{{ zuul.projects['github.com/openstack-k8s-operators/ci-framework'].src_dir  }}/scenarios/centos-10/hci_ceph_backends.yml"
        - "@{{ ansible_user_dir }}/{{ zuul.projects['github.com/openstack-k8s-operators/telemetry-operator'].src_dir }}/ci/vars-telemetry-with-ceph.yml"
        - "@{{ ansible_user_dir }}/{{ zuul.projects['github.com/infrawatch/feature-verification-tests'].src_dir }}/ci/vars-logging-test.yml"
        - "@{{ ansible_user_dir }}/{{ zuul.projects['github.com/openstack-k8s-operators/telemetry-operator'].src_dir }}/ci/vars-autoscaling-tempest.yml"
        - "@{{ ansible_user_dir }}/{{ zuul.projects['github.com/infrawatch/feature-verification-tests'].src_dir }}/ci/vars-functional-test.yml"
        - "@{{ ansible_user_dir }}/{{ zuul.projects['github.com/infrawatch/feature-verification-tests'].src_dir }}/ci/vars-use-master-containers.yml"
    irrelevant-files: *irrelevant_files
    required-projects: *required_projects

- job:
    name: functional-chargeback-tests
    parent: telemetry-operator-multinode-cloudkitty
    description: |
      Alias of telemetry-operator-multinode-cloudkitty for testing
    irrelevant-files: []
    roles:
      - zuul: github.com/openstack-k8s-operators/ci-framework
      - zuul: github.com/infrawatch/feature-verification-tests
    required-projects:
      - name: github.com/openstack-k8s-operators/telemetry-operator
        override-checkout: main
      - name: github.com/infrawatch/feature-verification-tests
      - name: github.com/openstack-k8s-operators/sg-core
        override-checkout: main
      - name: github.com/openstack-k8s-operators/prometheus-podman-exporter
        override-checkout: main
      - name: github.com/openstack-k8s-operators/mysqld_exporter
        override-checkout: main
    vars:
      cifmw_extras_base:
        - "@{{ ansible_user_dir }}/{{ zuul.projects['github.com/openstack-k8s-operators/ci-framework'].src_dir }}/scenarios/centos-10/multinode-ci.yml"
        # Need a config for CK
        - "@{{ ansible_user_dir }}/{{ zuul.projects['github.com/openstack-k8s-operators/telemetry-operator'].src_dir }}/ci/vars-cloudkitty-tempest.yml"
        - "@{{ ansible_user_dir }}/{{ zuul.projects['github.com/infrawatch/feature-verification-tests'].src_dir }}/ci/vars-cloudkitty-fvt.yml"

- job:
    name: functional-chargeback-tests-osp19
    parent: functional-chargeback-tests
    description: |
      Alias of telemetry-operator-multinode-cloudkitty for testing
    irrelevant-files: []
    dependencies:
      - name: s2i-openstack-container-content-provider
        # use the s2i content provider if it is in the job graph.
        soft: true
    vars:
      cifmw_crc_additional_insecure_registries: "{{ [s2i_content_provider_registry_ip ~ ':5001'] if s2i_content_provider_registry_ip is defined else [] }}"
      cifmw_crc_additional_allowed_registries: "{{ [s2i_content_provider_registry_ip ~ ':5001'] if s2i_content_provider_registry_ip is defined else [] }}"
      cifmw_set_containers_preserve_unlisted: true
      cifmw_set_containers_images: >-
        {{ (s2i_content_provider_os_custom_container_images |
           dict2items |
           json_query('[].{name: key, full_registry: value}'))
           if s2i_content_provider_os_custom_container_images is defined else [] }}
      cifmw_extras: "{{ [
        cifmw_extras_base_extra | default([]),
        cifmw_extras_scenario | default([])
      ] | flatten }}"

- job:
    name: functional-audit-logging-tests
    parent: telemetry-operator-multinode-logging
    abstract: true
    description: |
      Run audit logging tests
    extra-vars: *functional_autoscaling_extra_vars
    irrelevant-files: []
    roles:
      - zuul: github.com/openstack-k8s-operators/ci-framework
      - zuul: github.com/infrawatch/feature-verification-tests
    required-projects: *required_projects
    vars:
      cifmw_extras_base:
        - "@{{ ansible_user_dir }}/{{ zuul.projects['github.com/openstack-k8s-operators/ci-framework'].src_dir }}/scenarios/centos-10/multinode-ci.yml"
        - "@{{ ansible_user_dir }}/{{ zuul.projects['github.com/openstack-k8s-operators/telemetry-operator'].src_dir }}/ci/vars-logging.yml"
        - "@{{ ansible_user_dir }}/{{ zuul.projects['github.com/openstack-k8s-operators/telemetry-operator'].src_dir }}/ci/vars-autoscaling-tempest.yml"
        - "@{{ ansible_user_dir }}/{{ zuul.projects['github.com/openstack-k8s-operators/telemetry-operator'].src_dir }}/ci/vars-audit-logging.yml"
        - "@{{ ansible_user_dir }}/{{ zuul.projects['github.com/infrawatch/feature-verification-tests'].src_dir }}/ci/vars-audit-logging-fvt.yml"

- job:
    name: functional-audit-logging-tests-osp19
    dependencies:
      - name: s2i-openstack-container-content-provider
        # use the s2i content provider if it is in the job graph.
        soft: true
    parent: functional-audit-logging-tests
    description: |
      Run audit logging functional tests on osp19
    vars:
      cifmw_crc_additional_insecure_registries: "{{ [s2i_content_provider_registry_ip ~ ':5001'] if s2i_content_provider_registry_ip is defined else [] }}"
      cifmw_crc_additional_allowed_registries: "{{ [s2i_content_provider_registry_ip ~ ':5001'] if s2i_content_provider_registry_ip is defined else [] }}"
      cifmw_set_containers_preserve_unlisted: true
      cifmw_set_containers_images: >-
        {{ (s2i_content_provider_os_custom_container_images |
           dict2items |
           json_query('[].{name: key, full_registry: value}'))
           if s2i_content_provider_os_custom_container_images is defined else [] }}
      cifmw_extras: "{{ [
        cifmw_extras_base_extra | default([]),
        cifmw_extras_scenario | default([])
      ] | flatten }}"


- project:
    name: infrawatch/feature-verification-tests
    periodic:
      jobs:
        - telemetry-openstack-meta-content-provider-master:
            override-checkout: main
        - functional-periodic-telemetry-with-ceph
    github-check:
      jobs:
        - telemetry-container-image-content-provider:
            files:
              - ^ci/playbooks/container-image-build.yml$
              - ^ci/playbooks/container-image-content-provider.yml$
              - ^.zuul.yaml$
        - functional-chargeback-tests-osp19:
            files:
              - ^roles/telemetry_chargeback/.*$
              - ^roles/common/.*$
              - ^ci/vars-cloudkitty-fvt.yml$
              - ^ci/report_result.yml$
              - ^.zuul.yaml$
        - functional-audit-logging-tests-osp19:
            files:
              - ^roles/telemetry_audit_logging/.*$
              - ^roles/common/.*$
              - ^ci/vars-audit-logging-fvt.yml$
              - ^ci/run_audit_logging_tests.yml$
              - ^ci/report_result.yml$
              - ^.zuul.yaml$
        - feature-verification-tests-noop:
            files: *irrelevant_files
        - functional-tests-osp19
        - functional-logging-tests-osp19:
            irrelevant-files: *irrelevant_files
            files:
              - ^roles/telemetry_logging/.*$
              - ^roles/common/.*$
              - ^ci/vars-logging-test.yml$
              - ^ci/logging_tests_all.yml$
              - ^ci/logging_tests_computes.yml$
              - ^ci/logging_tests_controller.yml$
              - ^ci/report_result.yml$
              - ^.zuul.yaml$
          # still on 18
          #        - functional-periodic-telemetry-with-ceph:
          #            files:
          #              # Run this job for changes to the volume_pool_metrics test changes as this is
          #              # the only job, where those tests get executed and for changes to zuul.yaml in
          #              # case the job definition changes.
          #              - ^roles/telemetry_verify_metrics/tasks/verify_ceilometer_volume_pool_metrics.yml$
          #              - ^.zuul.yaml$
